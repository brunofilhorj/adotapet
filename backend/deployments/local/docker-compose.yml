services:
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    container_name: adotapet-postgres
    environment:
      POSTGRES_DB: adotapet
      POSTGRES_USER: adotapet
      POSTGRES_PASSWORD: adotapet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adotapet -d adotapet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0
    container_name: adotapet-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:12.8.1
    profiles: ["tools"]
    command: -connectRetries=20 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/adotapet
      FLYWAY_USER: adotapet
      FLYWAY_PASSWORD: adotapet
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ../../db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
